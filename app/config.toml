# PhotoCull developer config. The user never needs to edit this file;
# settings are exposed in the app window. All values are STARTING POINTS,
# to be tuned on real photos.

[grouping]
group_gap_seconds = 2.0      # portrait: new group when the gap between frames exceeds this
action_group_gap_seconds = 0.6  # action: frames of one shutter press are 0.12-0.3 s apart;
                             # a gap over ~0.5 s is a new press = a new moment (match sample)
max_group_size = 12          # long bursts are split into chunks of this size
keep_alternates = 2          # 2nd/3rd best frames copied to Alternates
skip_blurry_groups = true    # if even the sharpest frame of a moment is below
                             # detection.blurry_sharpness, copy nothing (user's choice;
                             # false = always pick one frame per moment, as in the plan)

# Each frame gets 0-1 sub-scores, compared with the other frames of its burst.
# total = weighted average of the sub-scores, minus penalties.
[scoring.portrait]           # weights must be >= 0 and not all zero
w_sharpness = 0.35
w_exposure = 0.25
w_eyes = 0.30
w_contrast = 0.10
closed_eyes_penalty = 0.30   # scaled by how many more eyes are open in the best frame
blown_penalty = 0.15         # subject has more than max_blown_pct blown pixels
crushed_penalty = 0.05       # subject has more than max_crushed_pct black pixels

[scoring.action]
w_sharpness = 0.55
w_exposure = 0.25
w_eyes = 0.10
w_contrast = 0.10
closed_eyes_penalty = 0.05   # relaxed: a blink matters less than a sharp moment
blown_penalty = 0.15
crushed_penalty = 0.05

[detection]
analysis_max_side = 1280     # downscale before analysis (low-power PC)
min_face_fraction = 0.08     # face height / frame height needed to judge eyes
ear_closed_threshold = 0.16  # eye aspect ratio below this = closed (0.20 flagged smiling squints; tuned on sample 1)
eye_focus_ratio = 0.5        # judge eyes only on faces at least this sharp vs the sharpest face
target_brightness_low = 70    # face brightness band (sample 1 edited faces 72-96, sample 2 camera faces 125-157)
target_brightness_high = 170
max_blown_pct = 3.0          # % of subject pixels >= 250
max_crushed_pct = 10.0       # % of subject pixels <= 5
face_confidence = 0.6        # face detector confidence (lower finds more, and more false faces)
max_eye_faces = 12           # judge eyes on at most this many faces per photo (speed)
blurry_sharpness = 15.0      # "blurry" below this Laplacian variance of the sharpest face (keepers in sample 1 were >= 25)...
blurry_relative = 0.5        # ...or below this fraction of the sharpest frame in the burst
min_contrast = 25.0          # "low_contrast" below this brightness std
exposure_falloff = 60.0      # exposure sub-score reaches 0 this far outside the target band
exposure_flag_margin = 30.0  # "over/underexposed" when this far outside the target band

[exposure_correction]
enabled = true
target_brightness = 120
max_stops = 1.0              # correction is capped at +/- this many stops
tolerance = 8                # skip if already within this of the target

[photoshop]
styles_folder = "Styles"     # RELATIVE to the project root (next to app/), never absolute
default_style_file = ""      # e.g. "MyLook.psd"; empty = ask in the UI
default_action = ""          # optional Action run after the style; empty = None
# manual fallback if .atn parsing fails:
# styles = { Warm = "Warm", Cool = "Cool" }
jpeg_quality = 92
retry_attempts = 3

[split]
max_per_post = 20
